<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menadżer kredytowy</title>

  <!-- font awesome -->
  <script src="https://kit.fontawesome.com/7fba28f91c.js" crossorigin="anonymous"></script>

</head>

<body>

  <aside class="sidebar">

    <section class="sidebar-head">
      <div class="sidebar-head__logo icon icon-main">
        <i class="fa-solid fa-anchor-lock"></i>
      </div>
      <div class="sidebar-head__name">
        <p class="sidebar-head__name-title">Smart Credit</p>
        <p class="sidebar-head__name-subtitle">Manager</p>
      </div>
    </section>

    <nav class="sidebar-navigation">

      <section class="sidebar-navigation-group">
        <div class="sidebar-navigation-group__title">Główne</div>

        <div class="sidebar-navigation-group__item active" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-desktop"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Pulpit</a>
          <span class="sidebar-navigation-group__item-badge">2</span>
        </div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-credit-card"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Moje kredyty</a>
        </div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-calendar-days"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Raty i płatności</a>
        </div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Analityka</a>
        </div>
      </section>

      <section class="sidebar-navigation-group">
        <div class="sidebar-navigation-group__title">Narzędzia</div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-calculator"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Kalkulator</a>
        </div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-regular fa-file"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Dokumenty</a>
        </div>
      </section>

      <section class="sidebar-navigation-group">
        <div class="sidebar-navigation-group__title">Konto</div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-bell"></i>
          </div>
          <a href="#" class="sidebar-navigation-group__item-name link link-navbar">Alerty</a>
        </div>

        <div class="sidebar-navigation-group__item" id="sidebar-nav-item">
          <div class="sidebar-navigation-group__item-icon">
            <i class="fa-solid fa-gear"></i>
          </div>
          <a class="sidebar-navigation-group__item-name">Ustawienia</a>
        </div>
      </section>

    </nav>

    <section class="sidebar-footer">
      <div class="sidebar-footer__item" id="sidebar-nav-user">
        <div class="sidebar-footer__logo">SG</div>
        <div class="sidebar-footer-name">
          <div class="sidebar-footer-name__user">Sebastian Gąsior</div>
          <div class="sidebar-footer-name__function">Klient Premium</div>
        </div>
      </div>
    </section>

  </aside>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
